# OPTIONAL Argo CD AppProject example for che-android-studio.
#
# This is a self-contained starting point for GitOps-syncing the Che editor
# definitions + sample cards (deploy/) into your Che namespace. It assumes
# nothing about a wider cluster umbrella — adjust the placeholders and apply.
#
# Placeholders to edit:
#   * <ARGOCD_NAMESPACE>  — where Argo CD runs (argocd, or openshift-gitops).
#   * <GIT_REPO_URL>      — your fork/clone of this repo.
#   * <CHE_NAMESPACE>     — your Che namespace (eclipse-che / openshift-devspaces).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: che-android-studio
  namespace: <ARGOCD_NAMESPACE>
spec:
  description: >
    che-android-studio — Eclipse Che editor definitions that deliver a streamed
    Android Studio / Android Studio for Platform desktop to developers' browsers.
  sourceRepos:
    - "<GIT_REPO_URL>"
  destinations:
    - server: https://kubernetes.default.svc
      namespace: <CHE_NAMESPACE>
  # No cluster-scoped resources are managed by this project.
  clusterResourceWhitelist: []
  # DevWorkspaces/Templates are runtime objects created by users opening a
  # workspace — never let a GitOps prune/selfHeal delete them.
  namespaceResourceBlacklist:
    - group: workspace.devfile.io
      kind: DevWorkspace
    - group: workspace.devfile.io
      kind: DevWorkspaceTemplate
