# Getting-started Sample cards for the Che "Create Workspace" dashboard page.
#
# Labeled ConfigMap in the Che namespace (default eclipse-che; adjust for your
# install, e.g. openshift-devspaces):
#   app.kubernetes.io/part-of=che.eclipse.org
#   app.kubernetes.io/component=getting-started-samples
# Served at /dashboard/api/getting-started-sample.
#
# Each card sets the per-sample `editor` field (the supported key — bundled
# samples expose it too) so the card auto-selects our editor. `url` points at a
# per-flavor sample repo (which can also carry /.che/che-editor.yaml as a
# backstop). Apply manually to your Che namespace:
#   kubectl -n eclipse-che apply -f deploy/getting-started-samples.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: che-android-studio-samples
  namespace: eclipse-che
  labels:
    app.kubernetes.io/part-of: che.eclipse.org
    app.kubernetes.io/component: getting-started-samples
data:
  che-android-studio-samples.json: "[\n  {\n    \"displayName\": \"Android Studio for Platform (split display)\",\n    \"description\": \"Streamed Android Studio for Platform (AOSP) desktop via KasmVNC.\",\n    \"tags\": [\n      \"Android\",\n      \"AOSP\",\n      \"ASfP\",\n      \"KasmVNC\"\n    ],\n    \"url\": \"https://github.com/belt-build/che-android-studio-asfp-sample\",\n    \"editor\": \"che-android-studio/asfp-split/latest\",\n    \"icon\": {\n      \"base64data\": \"\"\
    ,\n      \"mediatype\": \"image/svg+xml\"\n    }\n  },\n  {\n    \"displayName\": \"Android Studio (split display)\",\n    \"description\": \"Streamed Android Studio desktop for app development via KasmVNC.\",\n    \"tags\": [\n      \"Android\",\n      \"Studio\",\n      \"KasmVNC\"\n    ],\n    \"url\": \"https://github.com/belt-build/che-android-studio-studio-sample\",\n    \"editor\": \"che-android-studio/studio-split/latest\",\n    \"icon\": {\n      \"base64data\": \"\"\
    ,\n      \"mediatype\": \"image/svg+xml\"\n    }\n  }\n]"
