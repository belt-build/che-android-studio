name: ci

# Test → build → smoke. On main: build + push all four images to GHCR. On PRs:
# validate + build only (no push, so forks need no registry creds).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  # ghcr.io/<owner>/che-android-studio — lowercased owner (GHCR requires it).
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/che-android-studio

jobs:
  # --- Fast validation (no Docker) -----------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean-room guard (no internal tokens)
        run: |
          # Fail if any internal/proprietary token reappears. This is the
          # regression guard that keeps the repo clean-room over time.
          # (Scope excludes .git and this workflow file, which names the tokens.
          # NOTE: openshift-devspaces / openshift-gitops are PUBLIC OpenShift
          # product namespaces this tool legitimately references — not internal.)
          pattern='connect-asfp|hatci|hyundai|zscaler|gerrit|jfrog|gitlab|auto-hmg|isw-containers|sectigo|connect-builder|connect-cluster|connect-mirror|connect-android-sdk|connect-studio'
          if grep -rniE "$pattern" . \
                --exclude-dir=.git \
                --exclude=ci.yml ; then
            echo "::error::Internal/proprietary token found (see matches above)."
            exit 1
          fi
          echo "clean-room guard passed"

      - name: shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          # -S warning: gate on warnings+errors, not info/style notes (the
          # `A && log ok || log warn` logging idiom is intentional — SC2015 info).
          shellcheck -S warning \
                     container/entrypoint.sh \
                     hack/register-editors.sh

      - name: hadolint (Containerfiles)
        run: |
          # Gate on errors only; ignore intentional patterns:
          #   DL3008 — we don't pin apt package versions (dev images track latest)
          #   DL4006 — pipes inside RUN are guarded by `set -e`/explicit checks
          #   SC2086 — the SDK build word-splits ${pkgs}/${lists} on purpose
          for f in container/sdk/Containerfile \
                   container/editor/Containerfile; do
            echo "hadolint $f"
            docker run --rm -i hadolint/hadolint hadolint \
              --failure-threshold error \
              --ignore DL3008 --ignore DL4006 --ignore SC2086 \
              - < "$f"
          done

      - name: Validate YAML + python
        run: |
          python -m pip install --quiet pyyaml
          # Editor definitions, samples, example devfile, argocd examples.
          for f in deploy/asfp-editor-definition.yaml \
                   deploy/studio-editor-definition.yaml \
                   deploy/getting-started-samples.yaml \
                   examples/devfile.yaml; do
            echo "yaml: $f"
            python -c "import sys,yaml; list(yaml.safe_load_all(open(sys.argv[1])))" "$f"
          done
          python -m py_compile container/inject-subpath-fix.py

  # --- Build (and push on main) --------------------------------------------
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # Only needed when we push (main / tags). PRs build without creds.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set tags
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      # sdk = the GUI-capable toolchain base + contribution placeholder. Loaded
      # into the local docker so the desktop smoke can stage onto it even on PRs
      # (push=false).
      - name: Build sdk
        uses: docker/build-push-action@v6
        with:
          context: container
          file: container/sdk/Containerfile
          load: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/sdk:latest
            ${{ env.IMAGE_PREFIX }}/sdk:${{ steps.meta.outputs.sha }}
          push: ${{ steps.meta.outputs.push }}
          cache-from: type=gha,scope=sdk
          cache-to: type=gha,scope=sdk,mode=max

      - name: Build asfp-editor
        uses: docker/build-push-action@v6
        with:
          context: container
          file: container/editor/Containerfile
          build-args: IDE_FLAVOR=asfp
          tags: |
            ${{ env.IMAGE_PREFIX }}/asfp-editor:latest
            ${{ env.IMAGE_PREFIX }}/asfp-editor:${{ steps.meta.outputs.sha }}
          push: ${{ steps.meta.outputs.push }}
          cache-from: type=gha,scope=asfp-editor
          cache-to: type=gha,scope=asfp-editor,mode=max

      - name: Build studio-editor
        uses: docker/build-push-action@v6
        with:
          context: container
          file: container/editor/Containerfile
          build-args: IDE_FLAVOR=studio
          tags: |
            ${{ env.IMAGE_PREFIX }}/studio-editor:latest
            ${{ env.IMAGE_PREFIX }}/studio-editor:${{ steps.meta.outputs.sha }}
          push: ${{ steps.meta.outputs.push }}
          cache-from: type=gha,scope=studio-editor
          cache-to: type=gha,scope=studio-editor,mode=max

  # --- Smoke test (main only; images are published) ------------------------
  smoke:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: SDK smoke — installed API levels + no emulator
        run: |
          img="${IMAGE_PREFIX}/sdk:latest"
          echo "== installed packages =="
          docker run --rm "$img" sdkmanager --list_installed | tee /tmp/pkgs.txt
          for lvl in 34 36; do
            grep -q "platforms;android-${lvl}" /tmp/pkgs.txt \
              || { echo "::error::platforms;android-${lvl} missing"; exit 1; }
          done
          if docker run --rm "$img" sh -c 'test -d "$ANDROID_SDK_ROOT/emulator"'; then
            echo "::error::emulator should not be installed"; exit 1
          fi
          echo "sdk smoke passed"

      - name: Desktop smoke — staged KasmVNC serves plain HTTP 200 on 6901
        run: |
          # Emulate the container-contribution split WITHOUT Che: the asfp-editor
          # injector stages the IDE + relocated KasmVNC + assets into a shared
          # volume, then the sdk (toolchain) base runs the staged entrypoint. This
          # proves the RELOCATED KasmVNC comes up from the volume against only the
          # base image's runtime libs (-DisableBasicAuth + require_ssl:false +
          # -config + PERL5LIB). The IDE itself won't render headless, but KasmVNC
          # must answer HTTP 200. It binds -interface 127.0.0.1 (Che's in-pod
          # loopback), unreachable via host `-p`, so we curl from inside the netns.
          editor="${IMAGE_PREFIX}/asfp-editor:latest"
          base="${IMAGE_PREFIX}/sdk:latest"
          docker volume create cas >/dev/null
          echo "== stage editor payload into shared volume =="
          docker run --rm -v cas:/che-android-studio "$editor" /bin/sh -c '
            set -eux
            src=$(readlink -f /opt/che-ide)
            rm -rf /che-android-studio/ide; mkdir -p /che-android-studio/ide
            cp -RL "$src/." /che-android-studio/ide/
            cp -R /opt/che-android-studio/. /che-android-studio/'
          echo "== staged tree sanity =="
          docker run --rm -v cas:/che-android-studio "$base" sh -c '
            set -eux
            test -x /che-android-studio/kasmvnc/usr/bin/kasmvncserver
            test -f /che-android-studio/kasmvnc/usr/share/kasmvnc/www/index.html
            test -f /che-android-studio/pki/snakeoil.pem'
          echo "== run toolchain base against staged entrypoint =="
          docker run -d --name smoke -e IDE_FLAVOR=asfp -v cas:/che-android-studio \
            "$base" sh -c '/che-android-studio/entrypoint.sh'
          ok=0
          for i in $(seq 1 90); do
            if docker exec smoke curl -sf -o /dev/null http://127.0.0.1:6901/; then
              echo "desktop smoke passed (HTTP 200 on 6901)"; ok=1; break
            fi
            sleep 2
          done
          echo "===== container logs ====="; docker logs smoke 2>&1 | tail -80 || true
          docker rm -f smoke >/dev/null 2>&1 || true
          docker volume rm cas >/dev/null 2>&1 || true
          [ "$ok" = "1" ] || { echo "::error::staged KasmVNC did not serve on 6901"; exit 1; }
