name: ci

# Test → build → smoke. On main: build + push all five images to GHCR. On PRs:
# validate + build only (no push, so forks need no registry creds).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  # ghcr.io/<owner>/che-android-studio — lowercased owner (GHCR requires it).
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/che-android-studio

jobs:
  # --- Fast validation (no Docker) -----------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean-room guard (no internal tokens)
        run: |
          # Fail if any internal/proprietary token reappears. This is the
          # regression guard that keeps the repo clean-room over time.
          # (Scope excludes .git and this workflow file, which names the tokens.
          # NOTE: openshift-devspaces / openshift-gitops are PUBLIC OpenShift
          # product namespaces this tool legitimately references — not internal.)
          pattern='connect-asfp|hatci|hyundai|zscaler|gerrit|jfrog|gitlab|auto-hmg|isw-containers|sectigo|connect-builder|connect-cluster|connect-mirror|connect-android-sdk|connect-studio'
          if grep -rniE "$pattern" . \
                --exclude-dir=.git \
                --exclude=ci.yml ; then
            echo "::error::Internal/proprietary token found (see matches above)."
            exit 1
          fi
          echo "clean-room guard passed"

      - name: shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          # -S warning: gate on warnings+errors, not info/style notes (the
          # `A && log ok || log warn` logging idiom is intentional — SC2015 info).
          shellcheck -S warning \
                     container/entrypoint.sh \
                     container/desktop/setup-desktop.sh \
                     hack/register-editors.sh

      - name: hadolint (Containerfiles)
        run: |
          # Gate on errors only; ignore intentional patterns:
          #   DL3008 — we don't pin apt package versions (dev images track latest)
          #   DL4006 — pipes inside RUN are guarded by `set -e`/explicit checks
          #   SC2086 — the SDK build word-splits ${pkgs}/${lists} on purpose
          for f in container/sdk/Containerfile \
                   container/dev/asfp/Containerfile \
                   container/dev/studio/Containerfile \
                   container/editor/Containerfile; do
            echo "hadolint $f"
            docker run --rm -i hadolint/hadolint hadolint \
              --failure-threshold error \
              --ignore DL3008 --ignore DL4006 --ignore SC2086 \
              - < "$f"
          done

      - name: Validate YAML + python
        run: |
          python -m pip install --quiet pyyaml
          # Editor definitions, samples, example devfile, argocd examples.
          for f in deploy/asfp-editor-definition.yaml \
                   deploy/studio-editor-definition.yaml \
                   deploy/getting-started-samples.yaml \
                   examples/devfile.yaml; do
            echo "yaml: $f"
            python -c "import sys,yaml; list(yaml.safe_load_all(open(sys.argv[1])))" "$f"
          done
          python -m py_compile container/inject-subpath-fix.py

  # --- Build (and push on main) --------------------------------------------
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # THE RUNNER CANNOT HOLD THESE IMAGES AS SHIPPED. asfp-editor alone is
      # ~6.95 GB and asfp-dev ~3.41 GB; five of them plus a mode=max cache
      # export exceeds the ~30 GB a fresh ubuntu-latest has free, and the build
      # died on the fourth image every time.
      #
      # Deleting the preinstalled toolchains buys back ~25 GB. Note the irony of
      # the largest one: /usr/local/lib/android is a preinstalled Android SDK
      # this build has no use for — it builds its own.
      - name: Free runner disk
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/share/powershell \
                      /usr/share/swift "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo apt-get clean || true
          echo "after:"; df -h / | tail -1

      - uses: docker/setup-buildx-action@v3

      # ALWAYS, including PRs. The old comment said "PRs build without creds",
      # which cannot work: asfp-dev/studio-dev are FROM ghcr.io/.../sdk, that
      # package is private, and an unauthenticated pull 401s —
      #   failed to fetch anonymous token: unexpected status from GET request
      # so every PR build died on the second image. `load: true` on sdk did not
      # save it either: setup-buildx-action creates a docker-CONTAINER driver,
      # which cannot see the docker daemon local image store, so the FROM always
      # resolves against the registry.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set tags
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      # sdk first — the dev images build FROM it, BY DIGEST-TAG FROM THE
      # REGISTRY, not from a local load. `load: true` is gone: the container
      # driver cannot read the daemon store, so it was several GB of runner disk
      # that nothing ever consulted.
      - name: Build sdk
        uses: docker/build-push-action@v6
        with:
          context: container
          file: container/sdk/Containerfile
          tags: |
            ${{ env.IMAGE_PREFIX }}/sdk:latest
            ${{ env.IMAGE_PREFIX }}/sdk:${{ steps.meta.outputs.sha }}
          push: ${{ steps.meta.outputs.push }}
          cache-from: type=gha,scope=sdk
          cache-to: type=gha,scope=sdk,mode=max

      - name: Build asfp-dev
        uses: docker/build-push-action@v6
        with:
          context: container
          file: container/dev/asfp/Containerfile
          build-args: |
            IMAGE_PREFIX=${{ env.IMAGE_PREFIX }}
            SDK_TAG=latest
          tags: |
            ${{ env.IMAGE_PREFIX }}/asfp-dev:latest
            ${{ env.IMAGE_PREFIX }}/asfp-dev:${{ steps.meta.outputs.sha }}
          push: ${{ steps.meta.outputs.push }}
          cache-from: type=gha,scope=asfp-dev
          cache-to: type=gha,scope=asfp-dev,mode=max

      - name: Build studio-dev
        uses: docker/build-push-action@v6
        with:
          context: container
          file: container/dev/studio/Containerfile
          build-args: |
            IMAGE_PREFIX=${{ env.IMAGE_PREFIX }}
            SDK_TAG=latest
          tags: |
            ${{ env.IMAGE_PREFIX }}/studio-dev:latest
            ${{ env.IMAGE_PREFIX }}/studio-dev:${{ steps.meta.outputs.sha }}
          push: ${{ steps.meta.outputs.push }}
          cache-from: type=gha,scope=studio-dev
          cache-to: type=gha,scope=studio-dev,mode=max

      # The editor images are the two biggest (~6.95 GB each) and they build
      # back to back. buildx keeps its layer cache on the runner even when the
      # result streams to the registry, so reclaim between them rather than
      # discovering the ceiling again at the last step.
      - name: Reclaim build cache
        run: |
          docker buildx prune -af --verbose 2>/dev/null | tail -2 || true
          df -h / | tail -1

      - name: Build asfp-editor
        uses: docker/build-push-action@v6
        with:
          context: container
          file: container/editor/Containerfile
          build-args: IDE_FLAVOR=asfp
          tags: |
            ${{ env.IMAGE_PREFIX }}/asfp-editor:latest
            ${{ env.IMAGE_PREFIX }}/asfp-editor:${{ steps.meta.outputs.sha }}
          push: ${{ steps.meta.outputs.push }}
          cache-from: type=gha,scope=asfp-editor
          cache-to: type=gha,scope=asfp-editor,mode=max

      - name: Build studio-editor
        uses: docker/build-push-action@v6
        with:
          context: container
          file: container/editor/Containerfile
          build-args: IDE_FLAVOR=studio
          tags: |
            ${{ env.IMAGE_PREFIX }}/studio-editor:latest
            ${{ env.IMAGE_PREFIX }}/studio-editor:${{ steps.meta.outputs.sha }}
          push: ${{ steps.meta.outputs.push }}
          cache-from: type=gha,scope=studio-editor
          cache-to: type=gha,scope=studio-editor,mode=max

  # --- Smoke test (main only; images are published) ------------------------
  smoke:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: SDK smoke — installed API levels + no emulator
        run: |
          img="${IMAGE_PREFIX}/sdk:latest"
          echo "== installed packages =="
          docker run --rm "$img" sdkmanager --list_installed | tee /tmp/pkgs.txt
          for lvl in 34 36; do
            grep -q "platforms;android-${lvl}" /tmp/pkgs.txt \
              || { echo "::error::platforms;android-${lvl} missing"; exit 1; }
          done
          if docker run --rm "$img" sh -c 'test -d "$ANDROID_SDK_ROOT/emulator"'; then
            echo "::error::emulator should not be installed"; exit 1
          fi
          echo "sdk smoke passed"

      - name: Desktop smoke — KasmVNC serves plain HTTP 200 on 6901
        run: |
          img="${IMAGE_PREFIX}/asfp-dev:latest"
          # Run the entrypoint; it starts KasmVNC on 6901. The IDE payload isn't
          # staged (no editor injector here), so the IDE won't launch and the
          # skel seeds are absent — but KasmVNC itself must still come up and
          # answer HTTP 200 (proves -DisableBasicAuth + require_ssl:false survived
          # the rename). KasmVNC binds -interface 127.0.0.1 (required for Che's
          # in-pod loopback gateway), which a host-side `-p` mapping can't reach —
          # so we curl from INSIDE the container's network namespace via exec.
          docker run -d --name smoke "$img"
          ok=0
          for i in $(seq 1 90); do
            if docker exec smoke curl -sf -o /dev/null http://127.0.0.1:6901/; then
              echo "desktop smoke passed (HTTP 200 on 6901)"; ok=1; break
            fi
            sleep 2
          done
          echo "===== container logs ====="; docker logs smoke 2>&1 | tail -60 || true
          docker rm -f smoke >/dev/null 2>&1 || true
          [ "$ok" = "1" ] || { echo "::error::KasmVNC did not serve on 6901"; exit 1; }
